trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '20.x'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildSite
        displayName: npm install + build
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: Setup Node.js

          - script: npm ci
            displayName: Install dependencies

          - script: npm run build
            displayName: Build static site

          - publish: dist
            artifact: site-dist
            displayName: Publish dist artifact

  - stage: Deploy
    displayName: Deploy to Cloudflare Pages
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployCloudflare
        displayName: Deploy via Wrangler
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: site-dist
                  displayName: Download dist artifact

                - script: npm install -g wrangler
                  displayName: Install Wrangler CLI

                - script: |
                    wrangler pages deploy $(Pipeline.Workspace)/site-dist \
                      --project-name=leaf-wraparound \
                      --branch=main
                  displayName: Deploy to Cloudflare Pages
                  env:
                    CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
                    CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
